[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hackathon-intelligence-platform"
version = "0.1.0"
description = "Global Hackathon Intelligence Platform"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.143.1",
  "starlette>=1.3.1,<2.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "sqlalchemy==2.0.50",
  "alembic==1.20.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=6,<7",
  "celery>=5.5,<6.0",
  "boto3>=1.40,<2.0",
  "httpx>=0.28,<0.29",
  "httpcore>=1.0.9,<1.1",
  "beautifulsoup4>=4.14,<5.0",
  "defusedxml>=0.7.1,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
  "httpx>=0.28,<0.29",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "types-redis>=4.6,<5",
]

[tool.setuptools]
package-dir = {"hackathon_api" = "apps/api/src/hackathon_api", "hackathon_worker" = "apps/worker/src/hackathon_worker", "hackathon_shared" = "packages/shared/src/hackathon_shared", "hackathon_sources" = "packages/source_sdk/src/hackathon_sources", "hackathon_intelligence" = "packages/intelligence/src/hackathon_intelligence", "hackathon_discovery" = "packages/discovery/src/hackathon_discovery", "hackathon_recommendation" = "packages/recommendation/src/hackathon_recommendation", "hackathon_alerts" = "packages/alerts/src/hackathon_alerts", "hackathon_operations" = "packages/operations/src/hackathon_operations"}
packages = ["hackathon_api", "hackathon_worker", "hackathon_shared", "hackathon_sources", "hackathon_intelligence", "hackathon_discovery", "hackathon_recommendation", "hackathon_alerts", "hackathon_operations"]

[tool.pytest.ini_options]
pythonpath = [
  "apps/api/src", "apps/worker/src", "packages/shared/src",
  "packages/source_sdk/src", "packages/intelligence/src",
  "packages/discovery/src", "packages/recommendation/src",
  "packages/alerts/src", "packages/operations/src",
]
testpaths = ["apps/api/tests", "packages/shared/tests", "packages/source_sdk/tests", "packages/intelligence/tests", "packages/discovery/tests", "packages/recommendation/tests", "packages/alerts/tests", "packages/operations/tests"]
addopts = "--strict-markers --disable-warnings"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Ruff formatter cannot safely wrap long literal SQL, URLs or report prose.
# Retain all other error, correctness, and import checks.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = ["apps/api/src", "apps/worker/src", "packages/shared/src", "packages/source_sdk/src", "packages/intelligence/src", "packages/discovery/src", "packages/recommendation/src", "packages/alerts/src", "packages/operations/src"]
