name: One-off Python lint normalization
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  normalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'checkpoint/iteration31-20261022'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'ruff>=0.12,<1'
      - name: Autofix safe rules and normalize Python formatting
        run: |
          ruff check --fix apps packages scripts db/alembic/versions || true
          ruff format apps packages scripts db/alembic/versions
          ruff check --output-format concise apps packages scripts db/alembic/versions > /tmp/remaining-ruff.txt || true
          tail -20 /tmp/remaining-ruff.txt
      - name: Commit style-only normalization to checkpoint branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps packages scripts db/alembic/versions
          if ! git diff --cached --quiet; then
            git commit -m 'style(python): Ruff safe fixes and formatter across monorepo'
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
